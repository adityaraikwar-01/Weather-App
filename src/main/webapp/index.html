<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - CodingWallahSir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

</head>
<body>
<div style="color:white; text-align:center">
<img src="images/weather-logo.png" style=" height: auto;width: auto;filter: drop-shadow(10px 10px 10px black);">
    <h1>Welcome to the Weather Web App</h1>

 
    <h2>Technologies Used: </h2> <p>HTML, CSS, JS, Java, Servlet, JSP, OpenWeather API</p>
     <form action="MyServlet" method="post" class="searchInput">
            <input type="text" placeholder="Enter City Name" id="searchInput" name="city"/>
            <button id="searchButton"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>    
 </div>
     
     
     <div id="loader" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     z-index:9999; background:rgba(7,18,26,0.85); color:#fff;
     flex-direction:column; align-items:center; justify-content:center;">
    <div style="width:56px; height:56px; border:6px solid rgba(255,255,255,0.25);
         border-top-color:#fff; border-radius:50%; animation:spin 0.9s linear infinite;
         margin-bottom:16px;"></div>
    <p>Fetching weather...</p>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var form = document.querySelector("form");
    var loader = document.getElementById("loader");

    form.addEventListener("submit", function () {
        loader.style.display = "flex";
    });
});

window.addEventListener("pageshow", function () {
    document.getElementById("loader").style.display = "none";
});
</script>
     
</body>
</html>
